services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      # 容器内可通过 host.docker.internal 访问宿主机上的 PostgreSQL
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-word-catch-dev-secret-change-me}
