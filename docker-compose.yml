services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:../sqlite/wordcatch.db
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-word-catch-dev-secret-change-me}
    volumes:
      - sqlite_data:/app/sqlite

volumes:
  sqlite_data:
